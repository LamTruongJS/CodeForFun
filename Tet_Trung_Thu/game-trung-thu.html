<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hứng Bánh Trung Thu 🥮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a1f3a 50%, #2d1b4e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #0f172a 0%, #1e293b 100%);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(30, 41, 59, 0.98) 100%);
            padding: 50px 40px;
            border-radius: 30px;
            text-align: center;
            backdrop-filter: blur(15px);
            border: 4px solid #fbbf24;
            box-shadow: 0 0 60px rgba(251, 191, 36, 0.6), inset 0 0 30px rgba(251, 191, 36, 0.1);
            animation: popIn 0.5s forwards;
            z-index: 10;
            min-width: 300px;
        }

        @keyframes popIn {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        #gameOver h2 {
            color: #fbbf24;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.8), 0 4px 8px rgba(0, 0, 0, 0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }

        #gameOver p {
            color: #e2e8f0;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.6;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        #gameOver p strong {
            color: #fbbf24;
            font-size: 24px;
            display: block;
            margin: 8px 0;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
        }

        #restartBtn {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1e293b;
            border: none;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #restartBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(251, 191, 36, 0.7);
            background: linear-gradient(135deg, #fcd34d 0%, #fbbf24 100%);
        }

        #restartBtn:active {
            transform: translateY(-1px);
        }

        .hidden {
            display: none;
        }

        #mobileControls {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            justify-content: space-around;
            padding: 0 20px;
        }

        .controlBtn {
            width: 80px;
            height: 80px;
            background: rgba(251, 191, 36, 0.3);
            border: 3px solid #fbbf24;
            border-radius: 50%;
            color: #fbbf24;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(10px);
        }

        .controlBtn:active {
            background: rgba(251, 191, 36, 0.5);
        }

        @media (max-width: 500px) {
            #mobileControls {
                display: flex;
            }
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="500" height="700"></canvas>
        <div id="gameOver" class="hidden">
            <h2 style="white-space: nowrap;">Game Over! 🌕</h2>
            <p>Bạn đã hứng được<strong>${score} bánh 🥮</strong></p>
            <button id="restartBtn">Chơi lại 🎮</button>
        </div>
        <div id="mobileControls">
            <div class="controlBtn" id="leftBtn">◄</div>
            <div class="controlBtn" id="rightBtn">►</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive canvas
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            if (window.innerWidth < 550) {
                const scale = window.innerWidth / 550;
                container.style.transform = `scale(${scale})`;
            } else {
                container.style.transform = 'scale(1)';
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game variables
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let speed = 1.5;
        let lastSpeedIncrease = 0;

        // Basket
        const basket = {
            x: canvas.width / 2 - 40,
            y: canvas.height - 80,
            width: 80,
            height: 30,
            speed: 7,
            dx: 0
        };

        // Arrays
        let mooncakes = [];
        let specialItems = [];
        let particles = [];
        let stars = [];
        let floatingTexts = [];
        let fireworks = [];
        let powerups = {
            slowMotion: { active: false, endTime: 0 },
            doubleScore: { active: false, endTime: 0 },
            shield: { active: false, endTime: 0 }
        };

        // Keyboard controls
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Mobile controls
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            basket.dx = -basket.speed;
        });
        document.getElementById('leftBtn').addEventListener('touchend', () => {
            basket.dx = 0;
        });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            basket.dx = basket.speed;
        });
        document.getElementById('rightBtn').addEventListener('touchend', () => {
            basket.dx = 0;
        });

        // Tạo sao nền
        function createStars() {
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2,
                    opacity: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.01,
                    twinkleDirection: Math.random() > 0.5 ? 1 : -1
                });
            }
        }

        // Vẽ background
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0f172a');
            gradient.addColorStop(1, '#1e293b');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ sao
            stars.forEach(star => {
                star.opacity += star.twinkleSpeed * star.twinkleDirection;
                if (star.opacity >= 1 || star.opacity <= 0.2) {
                    star.twinkleDirection *= -1;
                }
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();
            });

            // Vẽ trăng
            const moonGradient = ctx.createRadialGradient(350, 80, 10, 350, 80, 40);
            moonGradient.addColorStop(0, '#fef3c7');
            moonGradient.addColorStop(1, '#fbbf24');
            ctx.beginPath();
            ctx.arc(350, 80, 40, 0, Math.PI * 2);
            ctx.fillStyle = moonGradient;
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#fbbf24';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Vẽ giỏ
        function drawBasket() {
            ctx.save();

            ctx.shadowColor = 'rgba(220, 38, 38, 0.4)';
            ctx.shadowBlur = 20;

            const centerX = basket.x + basket.width / 2;
            const centerY = basket.y + basket.height / 2;

            // Viền ngoài vàng
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, basket.width / 2, basket.height / 2, 0, 0, Math.PI * 2);
            const outerGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, basket.width / 2);
            outerGradient.addColorStop(0, '#fef3c7');
            outerGradient.addColorStop(0.7, '#fbbf24');
            outerGradient.addColorStop(1, '#d97706');
            ctx.fillStyle = outerGradient;
            ctx.fill();
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Đĩa bên trong đỏ
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, basket.width / 2 - 8, basket.height / 2 - 6, 0, 0, Math.PI * 2);
            const innerGradient = ctx.createRadialGradient(centerX, centerY - 5, 0, centerX, centerY, basket.width / 2);
            innerGradient.addColorStop(0, '#fca5a5');
            innerGradient.addColorStop(0.5, '#ef4444');
            innerGradient.addColorStop(1, '#dc2626');
            ctx.fillStyle = innerGradient;
            ctx.fill();

            // Họa tiết hoa văn
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 / 8) * i;
                const x1 = centerX + Math.cos(angle) * 15;
                const y1 = centerY + Math.sin(angle) * 10;
                const x2 = centerX + Math.cos(angle) * 25;
                const y2 = centerY + Math.sin(angle) * 15;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Các loại bánh với emoji
        const mooncakeTypes = [
            { name: 'Bánh Dẻo', emoji: '🥮', shadowColor: '251, 191, 36' },
            { name: 'Bánh Trăng', emoji: '🌕', shadowColor: '234, 179, 8' },
            { name: 'Bánh Ngọt', emoji: '🧁', shadowColor: '236, 72, 153' },
            { name: 'Donut', emoji: '🍩', shadowColor: '249, 115, 22' },
            { name: 'Cookie', emoji: '🍪', shadowColor: '180, 83, 9' },
            { name: 'Bánh Kem', emoji: '🎂', shadowColor: '244, 114, 182' }
        ];

        // Vẽ bánh
        function drawMooncake(cake) {
            ctx.save();
            ctx.shadowColor = `rgba(${cake.shadowColor}, 0.8)`;
            ctx.shadowBlur = 20;
            ctx.font = `${cake.radius * 3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(cake.emoji, cake.x, cake.y);
            ctx.restore();
        }

        // Vẽ power-up
        function drawPowerUp(item) {
            ctx.save();

            ctx.shadowBlur = 25;
            ctx.shadowColor = item.glowColor;

            // Vòng sáng
            const pulse = Math.sin(Date.now() / 200) * 0.2 + 1;
            ctx.beginPath();
            ctx.arc(item.x, item.y, 25 * pulse, 0, Math.PI * 2);
            ctx.fillStyle = item.bgColor;
            ctx.globalAlpha = 0.3;
            ctx.fill();
            ctx.globalAlpha = 1;

            // Icon
            ctx.font = '35px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(item.emoji, item.x, item.y);

            // Stars rotating
            if (item.type === 'star') {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(Date.now() / 500);
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI / 2) * i;
                    const sx = Math.cos(angle) * 30;
                    const sy = Math.sin(angle) * 30;
                    ctx.font = '15px Arial';
                    ctx.fillText('✨', sx, sy);
                }
                ctx.restore();
            }

            ctx.restore();
        }

        // Tạo particles
        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    life: 1
                });
            }
        }

        // Update particles
        function updateParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.02;

                if (p.life <= 0) {
                    particles.splice(index, 1);
                    return;
                }

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Tạo pháo hoa
        function createFirework(x, y) {
            const colors = ['#ef4444', '#fbbf24', '#22c55e', '#3b82f6', '#a855f7', '#ec4899'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            for (let i = 0; i < 30; i++) {
                const angle = (Math.PI * 2 / 30) * i;
                const speed = Math.random() * 3 + 2;
                fireworks.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 2 + 1,
                    color: color,
                    life: 1,
                    trail: []
                });
            }
        }

        // Update pháo hoa
        function updateFireworks() {
            fireworks.forEach((fw, index) => {
                fw.trail.push({ x: fw.x, y: fw.y });
                if (fw.trail.length > 8) fw.trail.shift();

                fw.x += fw.vx;
                fw.y += fw.vy;
                fw.vy += 0.15;
                fw.vx *= 0.98;
                fw.life -= 0.015;

                if (fw.life <= 0) {
                    fireworks.splice(index, 1);
                    return;
                }

                ctx.save();
                fw.trail.forEach((pos, i) => {
                    ctx.globalAlpha = (i / fw.trail.length) * fw.life * 0.3;
                    ctx.fillStyle = fw.color;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, fw.radius * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();

                ctx.save();
                ctx.globalAlpha = fw.life;
                ctx.shadowColor = fw.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = fw.color;
                ctx.beginPath();
                ctx.arc(fw.x, fw.y, fw.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Pháo hoa ngẫu nhiên
        let lastFireworkTime = Date.now();
        function randomFireworks() {
            const currentTime = Date.now();
            if (currentTime - lastFireworkTime > 3000) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * 150 + 50;
                createFirework(x, y);
                lastFireworkTime = currentTime;
            }
        }

        // Floating text
        function createFloatingText(x, y, text, color) {
            floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                life: 1,
                vy: -2
            });
        }

        function updateFloatingTexts() {
            floatingTexts.forEach((ft, index) => {
                ft.y += ft.vy;
                ft.life -= 0.02;

                if (ft.life <= 0) {
                    floatingTexts.splice(index, 1);
                    return;
                }

                ctx.save();
                ctx.globalAlpha = ft.life;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });
        }

        // Vẽ UI
        function drawUI() {
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Điểm: ${score}`, 20, 35);

            ctx.textAlign = 'right';
            ctx.fillText('❤️'.repeat(lives), canvas.width - 20, 35);

            let indicatorY = 70;

            if (powerups.slowMotion.active && Date.now() < powerups.slowMotion.endTime) {
                const timeLeft = Math.ceil((powerups.slowMotion.endTime - Date.now()) / 1000);
                ctx.save();
                ctx.textAlign = 'center';
                ctx.fillStyle = '#a855f7';
                ctx.font = 'bold 18px Arial';
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 10;
                ctx.fillText(`⏱️ ${timeLeft}s`, canvas.width / 2, indicatorY);
                ctx.restore();
                indicatorY += 30;
            }

            if (powerups.doubleScore.active && Date.now() < powerups.doubleScore.endTime) {
                const timeLeft = Math.ceil((powerups.doubleScore.endTime - Date.now()) / 1000);
                ctx.save();
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 18px Arial';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 10;
                ctx.fillText(`⭐ x2 ${timeLeft}s`, canvas.width / 2, indicatorY);
                ctx.restore();
                indicatorY += 30;
            }

            if (powerups.shield.active && Date.now() < powerups.shield.endTime) {
                const timeLeft = Math.ceil((powerups.shield.endTime - Date.now()) / 1000);
                ctx.save();
                ctx.textAlign = 'center';
                ctx.fillStyle = '#22c55e';
                ctx.font = 'bold 18px Arial';
                ctx.shadowColor = '#22c55e';
                ctx.shadowBlur = 10;
                ctx.fillText(`💚 ${timeLeft}s`, canvas.width / 2, indicatorY);
                ctx.restore();
            }
        }

        // Update basket
        function updateBasket() {
            if (keys['ArrowLeft'] && basket.x > 0) {
                basket.x -= basket.speed;
            }
            if (keys['ArrowRight'] && basket.x + basket.width < canvas.width) {
                basket.x += basket.speed;
            }

            basket.x += basket.dx;

            if (basket.x < 0) basket.x = 0;
            if (basket.x + basket.width > canvas.width) {
                basket.x = canvas.width - basket.width;
            }
        }

        // Spawn mooncake
        function spawnMooncake() {
            if (Math.random() < 0.015) {
                const type = mooncakeTypes[Math.floor(Math.random() * mooncakeTypes.length)];
                mooncakes.push({
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: -30,
                    radius: 12,
                    speed: speed,
                    emoji: type.emoji,
                    shadowColor: type.shadowColor,
                    name: type.name
                });
            }
        }

        // Spawn power-up
        function spawnPowerUp() {
            if (Math.random() < 0.004) {
                const rand = Math.random();
                let item;

                if (rand < 0.33) {
                    item = {
                        type: 'slowmo',
                        emoji: '⏱️',
                        bgColor: 'rgba(168, 85, 247, 0.3)',
                        glowColor: 'rgba(168, 85, 247, 0.8)',
                        x: Math.random() * (canvas.width - 60) + 30,
                        y: -40,
                        speed: speed * 0.7
                    };
                } else if (rand < 0.66) {
                    item = {
                        type: 'star',
                        emoji: '⭐',
                        bgColor: 'rgba(251, 191, 36, 0.3)',
                        glowColor: 'rgba(251, 191, 36, 0.8)',
                        x: Math.random() * (canvas.width - 60) + 30,
                        y: -40,
                        speed: speed * 0.8
                    };
                } else {
                    item = {
                        type: 'shield',
                        emoji: '💚',
                        bgColor: 'rgba(34, 197, 94, 0.3)',
                        glowColor: 'rgba(34, 197, 94, 0.8)',
                        x: Math.random() * (canvas.width - 60) + 30,
                        y: -40,
                        speed: speed * 0.75
                    };
                }

                specialItems.push(item);
            }
        }

        // Update items
        function updateItems() {
            const slowMotionActive = powerups.slowMotion.active && Date.now() < powerups.slowMotion.endTime;
            const currentSpeed = slowMotionActive ? 0.3 : 1;

            mooncakes.forEach((cake, index) => {
                cake.y += cake.speed * currentSpeed;

                if (
                    cake.y + cake.radius >= basket.y &&
                    cake.y - cake.radius <= basket.y + basket.height &&
                    cake.x >= basket.x &&
                    cake.x <= basket.x + basket.width
                ) {
                    const points = powerups.doubleScore.active && Date.now() < powerups.doubleScore.endTime ? 2 : 1;
                    score += points;
                    createParticles(cake.x, cake.y, '#fbbf24');
                    createFirework(cake.x, cake.y);
                    if (points > 1) {
                        createFloatingText(cake.x, cake.y, 'x2!', '#fbbf24');
                    }
                    playSound('catch');
                    mooncakes.splice(index, 1);
                    return;
                }

                if (cake.y - cake.radius > canvas.height) {
                    if (powerups.shield.active && Date.now() < powerups.shield.endTime) {
                        createFloatingText(canvas.width / 2, canvas.height - 100, '🛡️ Protected!', '#22c55e');
                    } else {
                        lives--;
                        playSound('miss');
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                    mooncakes.splice(index, 1);
                }
            });

            specialItems.forEach((item, index) => {
                item.y += item.speed * currentSpeed;

                if (
                    item.y + 25 >= basket.y &&
                    item.y - 25 <= basket.y + basket.height &&
                    item.x >= basket.x &&
                    item.x <= basket.x + basket.width
                ) {
                    if (item.type === 'slowmo') {
                        powerups.slowMotion.active = true;
                        powerups.slowMotion.endTime = Date.now() + 6000;
                        createFloatingText(item.x, item.y, '⏱️ SLOW!', '#a855f7');
                    } else if (item.type === 'star') {
                        powerups.doubleScore.active = true;
                        powerups.doubleScore.endTime = Date.now() + 8000;
                        createFloatingText(item.x, item.y, '⭐ x2!', '#fbbf24');
                    } else if (item.type === 'shield') {
                        powerups.shield.active = true;
                        powerups.shield.endTime = Date.now() + 10000;
                        createFloatingText(item.x, item.y, '💚 SHIELD!', '#22c55e');
                    }

                    createParticles(item.x, item.y, '#a78bfa');
                    createFirework(item.x, item.y);
                    createFirework(item.x - 30, item.y - 20);
                    createFirework(item.x + 30, item.y - 20);
                    playSound('bonus');
                    specialItems.splice(index, 1);
                    return;
                }

                if (item.y - 25 > canvas.height) {
                    specialItems.splice(index, 1);
                }
            });
        }

        // Tăng tốc độ
        function increaseSpeed() {
            const currentTime = Date.now();
            if (currentTime - lastSpeedIncrease > 15000) {
                speed += 0.2;
                lastSpeedIncrease = currentTime;
            }
        }

        // Sound effects
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'catch') {
                oscillator.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'bonus') {
                oscillator.frequency.value = 1200;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } else if (type === 'miss') {
                oscillator.frequency.value = 200;
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            }
        }

        // End game
        function endGame() {
            gameRunning = false;
            const gameOverDiv = document.getElementById('gameOver');
            gameOverDiv.querySelector('p').innerHTML = `Bạn đã hứng được<strong>${score} bánh 🥮</strong>`;
            gameOverDiv.classList.remove('hidden');
        }

        // Restart game
        document.getElementById('restartBtn').addEventListener('click', () => {
            score = 0;
            lives = 3;
            speed = 1.5;
            lastSpeedIncrease = Date.now();
            mooncakes = [];
            specialItems = [];
            particles = [];
            floatingTexts = [];
            fireworks = [];
            powerups = {
                slowMotion: { active: false, endTime: 0 },
                doubleScore: { active: false, endTime: 0 },
                shield: { active: false, endTime: 0 }
            };
            gameRunning = true;
            document.getElementById('gameOver').classList.add('hidden');
            gameLoop();
        });

        // Main game loop
        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawBasket();

            mooncakes.forEach(cake => drawMooncake(cake));
            specialItems.forEach(item => drawPowerUp(item));

            updateParticles();
            updateFireworks();
            updateFloatingTexts();
            drawUI();

            updateBasket();
            spawnMooncake();
            spawnPowerUp();
            updateItems();
            increaseSpeed();
            randomFireworks();

            requestAnimationFrame(gameLoop);
        }

        // Start game
        createStars();
        lastSpeedIncrease = Date.now();
        gameLoop();
    </script>
</body>

</html>
